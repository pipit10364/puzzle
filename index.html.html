<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌙 Lebaran Puzzle Challenge</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #9b59b6 0%, #e67e22 50%, #f39c12 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        
        body::before {
            content: "🌙 ✨ 🕌";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            font-size: 40px;
            opacity: 0.05;
            pointer-events: none;
            display: flex;
            flex-wrap: wrap;
            gap: 80px;
            padding: 40px;
        }
        
        .container {
            background: #fef5e7;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
            position: relative;
            border: 4px solid #9b59b6;
        }
        
        h1 {
            font-family: 'Quicksand', sans-serif;
            text-align: center;
            color: #9b59b6;
            margin-bottom: 10px;
            font-size: 32px;
            font-weight: 700;
            text-shadow: 2px 2px 0px #f39c12;
        }
        
        .timer-display {
            text-align: center;
            font-size: 48px;
            font-weight: 700;
            color: #e67e22;
            font-family: 'Quicksand', sans-serif;
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 15px;
            border: 3px solid #f39c12;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .puzzle-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .puzzle-area {
            flex: 1;
            min-width: 300px;
            max-width: 600px;
        }
        
        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 2px;
            background: #9b59b6;
            padding: 2px;
            border-radius: 12px;
            aspect-ratio: 1;
            position: relative;
        }
        
        .puzzle-piece {
            background-size: 600% 600%;
            background-repeat: no-repeat;
            cursor: grab;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        
        .puzzle-piece:hover {
            transform: scale(1.05);
            z-index: 10;
            border-color: #f39c12;
        }
        
        .puzzle-piece.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        
        .puzzle-piece.correct {
            cursor: default;
            opacity: 1;
        }
        
        .pieces-pool {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            border: 3px solid #f39c12;
            max-width: 500px;
            margin: 0 auto;
        }
        
        .pieces-pool .puzzle-piece {
            aspect-ratio: 1;
            border-radius: 8px;
        }
        
        .start-screen, .victory-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(155, 89, 182, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }
        
        .start-content, .victory-content {
            background: #fef5e7;
            padding: 50px;
            border-radius: 30px;
            text-align: center;
            max-width: 500px;
            border: 5px solid #f39c12;
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }
        
        .start-content h2, .victory-content h2 {
            font-family: 'Quicksand', sans-serif;
            font-size: 36px;
            color: #9b59b6;
            margin-bottom: 20px;
            text-shadow: 2px 2px 0px #f39c12;
        }
        
        .start-content p {
            font-size: 18px;
            color: #555;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .btn {
            background: linear-gradient(135deg, #9b59b6, #e67e22);
            color: white;
            padding: 18px 40px;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Quicksand', sans-serif;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.3);
        }
        
        .hint-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #f39c12;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            z-index: 100;
            transition: all 0.3s;
        }
        
        .hint-btn:hover {
            transform: scale(1.1);
        }
        
        .hint-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.5);
            z-index: 2000;
            display: none;
            border: 4px solid #9b59b6;
            cursor: move;
        }
        
        .hint-modal.show {
            display: block;
        }
        
        .hint-modal img {
            max-width: 400px;
            max-height: 400px;
            border-radius: 12px;
            display: block;
        }
        
        .hint-close {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #e74c3c;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            font-weight: 700;
        }
        
        .victory-time {
            font-size: 64px;
            font-weight: 700;
            color: #e67e22;
            margin: 30px 0;
            font-family: 'Quicksand', sans-serif;
        }
        
        .victory-message {
            font-size: 20px;
            color: #555;
            margin-bottom: 30px;
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #f39c12;
            position: absolute;
            animation: confetti-fall 3s linear;
        }
        
        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        .hidden {
            display: none;
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 24px; }
            .timer-display { font-size: 36px; }
            .puzzle-area { min-width: 100%; }
            .hint-modal img { max-width: 90vw; max-height: 60vh; }
            .start-content, .victory-content { padding: 30px; }
        }
    </style>
</head>
<body>
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <div class="start-content">
            <h2>🌙 Lebaran Puzzle Challenge</h2>
            <p style="font-size:16px; margin-bottom:15px;">
                Susun 36 pieces puzzle secepat mungkin!<br>
                🎯 Beat the clock & screenshot your time!
            </p>
            <p style="font-size:14px; color:#888; margin-bottom:25px;">
                💡 Tip: Gunakan tombol "Hint" kalau butuh bantuan
            </p>
            <button class="btn" onclick="startPuzzle()">🚀 Mulai Sekarang!</button>
        </div>
    </div>
    
    <!-- Victory Screen -->
    <div class="victory-screen hidden" id="victoryScreen">
        <div class="victory-content">
            <h2>🎉 Selamat!</h2>
            <div class="victory-time" id="finalTime">00:00</div>
            <p class="victory-message">
                Kamu berhasil menyelesaikan puzzle!<br>
                📸 Screenshot waktumu & tag kami!
            </p>
            <button class="btn" onclick="location.reload()">🔄 Main Lagi</button>
        </div>
    </div>
    
    <!-- Hint Modal -->
    <div class="hint-modal" id="hintModal">
        <button class="hint-close" onclick="closeHint()">×</button>
        <img id="hintImage" src="" alt="Hint">
    </div>
    
    <!-- Main Game -->
    <div class="container">
        <h1>🌙 Lebaran Puzzle Challenge ✨</h1>
        
        <div class="timer-display" id="timer">00:00.0</div>
        
        <div class="puzzle-container">
            <div class="puzzle-area">
                <div class="puzzle-grid" id="puzzleGrid"></div>
            </div>
        </div>
        
        <div style="margin-top: 20px;">
            <h3 style="text-align:center; color:#9b59b6; margin-bottom:10px;">Pieces</h3>
            <div class="pieces-pool" id="piecesPool"></div>
        </div>
    </div>
    
    <button class="hint-btn" onclick="showHint()">💡 Hint</button>
    
    <!-- Audio -->
    <audio id="bgMusic" loop>
        <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_b3f6fe31c3.mp3" type="audio/mpeg">
    </audio>

    <script>
        const PUZZLE_IMAGE = 'https://raw.githubusercontent.com/pipit10364/CMON/main/CMON%202026_20260314_163020_0000.png';
        const GRID_SIZE = 6; // 6x6 = 36 pieces
        
        let pieces = [];
        let gridSlots = [];
        let startTime = null;
        let timerInterval = null;
        let draggedPiece = null;
        let completedPieces = 0;
        
        function initPuzzle() {
            const grid = document.getElementById('puzzleGrid');
            const pool = document.getElementById('piecesPool');
            
            // Create pieces array
            for (let row = 0; row < GRID_SIZE; row++) {
                for (let col = 0; col < GRID_SIZE; col++) {
                    pieces.push({ row, col, placed: false });
                }
            }
            
            // Shuffle pieces
            pieces.sort(() => Math.random() - 0.5);
            
            // Create grid slots
            for (let i = 0; i < GRID_SIZE * GRID_SIZE; i++) {
                const slot = document.createElement('div');
                slot.className = 'puzzle-slot';
                slot.dataset.index = i;
                slot.style.background = 'rgba(255,255,255,0.3)';
                
                slot.addEventListener('dragover', handleDragOver);
                slot.addEventListener('drop', handleDrop);
                
                grid.appendChild(slot);
                gridSlots.push(slot);
            }
            
            // Create pieces in pool
            pieces.forEach((piece, index) => {
                const pieceEl = document.createElement('div');
                pieceEl.className = 'puzzle-piece';
                pieceEl.draggable = true;
                pieceEl.dataset.row = piece.row;
                pieceEl.dataset.col = piece.col;
                pieceEl.dataset.index = index;
                
                pieceEl.style.backgroundImage = `url(${PUZZLE_IMAGE})`;
                pieceEl.style.backgroundPosition = `${piece.col * 20}% ${piece.row * 20}%`;
                
                pieceEl.addEventListener('dragstart', handleDragStart);
                pieceEl.addEventListener('dragend', handleDragEnd);
                
                pool.appendChild(pieceEl);
            });
        }
        
        function handleDragStart(e) {
            draggedPiece = e.target;
            e.target.classList.add('dragging');
        }
        
        function handleDragEnd(e) {
            e.target.classList.remove('dragging');
        }
        
        function handleDragOver(e) {
            e.preventDefault();
        }
        
        function handleDrop(e) {
            e.preventDefault();
            
            if (!draggedPiece) return;
            
            const slotIndex = parseInt(e.target.dataset.index);
            const pieceRow = parseInt(draggedPiece.dataset.row);
            const pieceCol = parseInt(draggedPiece.dataset.col);
            const correctIndex = pieceRow * GRID_SIZE + pieceCol;
            
            if (slotIndex === correctIndex) {
                // Correct placement
                e.target.appendChild(draggedPiece);
                draggedPiece.classList.add('correct');
                draggedPiece.draggable = false;
                draggedPiece.style.cursor = 'default';
                draggedPiece.style.width = '100%';
                draggedPiece.style.height = '100%';
                draggedPiece.style.borderRadius = '0';
                
                completedPieces++;
                
                if (completedPieces === GRID_SIZE * GRID_SIZE) {
                    finishPuzzle();
                }
            }
        }
        
        function startPuzzle() {
            document.getElementById('startScreen').classList.add('hidden');
            initPuzzle();
            startTimer();
            
            const music = document.getElementById('bgMusic');
            music.play().catch(() => {}); // Auto-play might be blocked
        }
        
        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = (Date.now() - startTime) / 1000;
                const minutes = Math.floor(elapsed / 60);
                const seconds = (elapsed % 60).toFixed(1);
                document.getElementById('timer').textContent = 
                    `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(4, '0')}`;
            }, 100);
        }
        
        function finishPuzzle() {
            clearInterval(timerInterval);
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            
            document.getElementById('bgMusic').pause();
            document.getElementById('finalTime').textContent = `${elapsed}s`;
            document.getElementById('victoryScreen').classList.remove('hidden');
            
            createConfetti();
        }
        
        function createConfetti() {
            const colors = ['#9b59b6', '#e67e22', '#f39c12', '#fef5e7'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 30);
            }
        }
        
        function showHint() {
            const modal = document.getElementById('hintModal');
            document.getElementById('hintImage').src = PUZZLE_IMAGE;
            modal.classList.add('show');
        }
        
        function closeHint() {
            document.getElementById('hintModal').classList.remove('show');
        }
        
        // Make hint modal draggable
        let isDragging = false;
        let currentX, currentY, initialX, initialY;
        
        const hintModal = document.getElementById('hintModal');
        hintModal.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);
        
        function dragStart(e) {
            if (e.target.className === 'hint-close') return;
            initialX = e.clientX - hintModal.offsetLeft;
            initialY = e.clientY - hintModal.offsetTop;
            isDragging = true;
        }
        
        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                hintModal.style.transform = `translate(${currentX}px, ${currentY}px)`;
            }
        }
        
        function dragEnd() {
            isDragging = false;
        }
    </script>
</body>
</html>
